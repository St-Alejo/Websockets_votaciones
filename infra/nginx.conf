# Dueño: Persona 1. Balanceador round-robin SIN afinidad (RT-2): prohibido ip_hash, hash,
# sticky o cookies de sesión. Cada petición / conexión nueva puede caer en cualquier réplica.
worker_processes auto;
worker_rlimit_nofile 200000;

events {
  worker_connections 65535;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;

  # Docker DNS: "app" resuelve a las 8 réplicas; nginx reparte en round-robin entre ellas.
  # `zone` comparte el estado del round-robin entre workers; sin ella cada worker empieza por
  # la misma réplica y las primeras peticiones (una por worker) caen todas en la misma.
  upstream app {
    zone app 64k;
    server app:3000;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Upstream $upstream_addr always;

    # WebSocket: jurados y auditores.
    location /ws/ {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Server-Sent Events: público. Sin búfer y con timeouts largos.
    location /sse/ {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Frontends estáticos de Persona 3, en el mismo origen que /ws/ y /sse/.
    location ~ ^/(publico|jurado|auditor)$ {
      return 301 /$1/;
    }
    location ~ ^/((publico|jurado|auditor)/|config\.js$) {
      root /usr/share/nginx/frontend;
      index index.html;
      add_header Cache-Control "no-cache" always;
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
    }
  }
}
