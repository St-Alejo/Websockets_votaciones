name: preconteo-dev

services:
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--hash-max-listpack-value',
        '128',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redis-dev-data:/data

volumes:
  redis-dev-data:
