# Dueño: Persona 1. Solo Redis, para desarrollar con `npm run dev` (1 instancia en :3000).
#   npm run redis:dev   (equivale a: docker compose -f infra/docker-compose.dev.yml up -d)
name: preconteo-dev

services:
  redis:
    image: redis:7-alpine
    # AOF everysec: pierde como máximo ~1 s ante un corte. hash-max-listpack-value 128: los
    # HASH acta:* (con el JSON de votos) siguen en listpack compacto (−34 % de memoria medido).
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--hash-max-listpack-value',
        '128',
      ]
    ports:
      - '6379:6379'
    volumes:
      - redis-dev-data:/data

volumes:
  redis-dev-data:
