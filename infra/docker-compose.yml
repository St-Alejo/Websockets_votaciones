name: preconteo

services:
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--hash-max-listpack-value',
        '128',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  seed:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ['node', 'scripts/seed-catalog.js']
    environment:
      REDIS_URL: redis://redis:6379
    restart: 'no'
    depends_on:
      redis:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3000
      LOG_LEVEL: info
      REDIS_COMMAND_TIMEOUT_MS: 1000
      RL_MAX: 20
      RL_WINDOW_MS: 60000
      STREAM_MAXLEN: 10000
    deploy:
      replicas: 8
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend:/usr/share/nginx/frontend:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  redis-data:
