<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resultados en vivo — Preconteo</title>
    <meta name="description" content="Resultados electorales del preconteo en tiempo real vía Server-Sent Events." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <h1>Preconteo en vivo</h1>
        <p class="muted" id="actualizada">Conectando…</p>
      </div>
      <div class="estado">
        <span id="badge-conexion" class="badge mid">conectando…</span>
        <span id="instancia" class="chip">—</span>
      </div>
    </header>

    <main>
      <section class="panel filtros">
        <form id="f-form" autocomplete="off">
          <label>Nivel
            <select id="f-nivel">
              <option value="dep">Departamento</option>
              <option value="mun">Municipio</option>
              <option value="pue">Puesto</option>
              <option value="mesa">Mesa</option>
            </select>
          </label>
          <label id="wrap-id" style="display:none">ID <input id="f-id" placeholder="p. ej. 11" /></label>
          <button type="submit">Ver</button>
          <button type="button" id="btn-reconectar" class="ghost">Reconectar</button>
        </form>
      </section>

      <section id="resumen" class="stats" aria-label="Resumen"></section>

      <section class="panel">
        <h2>Por candidato</h2>
        <div id="barras"><p class="muted">Cargando…</p></div>
      </section>

      <section class="panel">
        <h2>Detalle de votos</h2>
        <div class="tabla-wrap">
          <table>
            <thead><tr><th>Opción</th><th class="der">Votos</th><th class="der">% sufragantes</th></tr></thead>
            <tbody id="tbody-resultados"></tbody>
          </table>
        </div>
        <p class="muted sm">Fuente: <code>GET /sse/publico</code> (snapshot inicial + eventos en vivo).
          Sin recargas; la reconexión reanuda con el último id recibido.</p>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
