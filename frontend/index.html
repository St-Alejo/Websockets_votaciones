<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Real-time quick count</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f4f5fb;
        --card: #ffffff;
        --text: #161a33;
        --soft: #5b6078;
        --accent: #3f4bd8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #10132a;
          --card: #1a1e3a;
          --text: #eef0ff;
          --soft: #a5aac8;
          --accent: #8c95ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(560px, calc(100% - 32px));
      }
      h1 {
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 24px;
        color: var(--soft);
      }
      a {
        display: block;
        margin-bottom: 12px;
        padding: 18px 20px;
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        text-decoration: none;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.12);
      }
      a:hover {
        outline: 2px solid var(--accent);
      }
      strong {
        display: block;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Real-time quick count</h1>
      <p>Choose the application.</p>
      <a href="./public/?topic=dept"
        ><strong>Public results</strong>Live totals via Server-Sent Events.</a
      >
      <a href="./juror/"
        ><strong>Juror app</strong>Submit tallies over WebSocket, works offline.</a
      >
      <a href="./auditor/"
        ><strong>Audit console</strong>Verification queue, locks and presence.</a
      >
    </main>
  </body>
</html>
