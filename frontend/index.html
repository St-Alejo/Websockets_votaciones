<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preconteo en tiempo real</title>
    <style>
      :root {
        color-scheme: light dark;
        --fondo: #f4f5fb;
        --tarjeta: #ffffff;
        --texto: #161a33;
        --suave: #5b6078;
        --acento: #3f4bd8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #10132a;
          --tarjeta: #1a1e3a;
          --texto: #eef0ff;
          --suave: #a5aac8;
          --acento: #8c95ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--fondo);
        color: var(--texto);
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(560px, calc(100% - 32px));
      }
      h1 {
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 24px;
        color: var(--suave);
      }
      a {
        display: block;
        margin-bottom: 12px;
        padding: 18px 20px;
        border-radius: 12px;
        background: var(--tarjeta);
        color: var(--texto);
        text-decoration: none;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.12);
      }
      a:hover {
        outline: 2px solid var(--acento);
      }
      strong {
        display: block;
        color: var(--acento);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Preconteo en tiempo real</h1>
      <p>Elige la aplicación.</p>
      <a href="./publico/?topico=dep"
        ><strong>Resultados públicos</strong>Acumulado en vivo por Server-Sent Events.</a
      >
      <a href="./jurado/"
        ><strong>App del jurado</strong>Envío de actas por WebSocket, funciona sin conexión.</a
      >
      <a href="./auditor/"
        ><strong>Consola de auditoría</strong>Cola de verificación, bloqueos y presencia.</a
      >
    </main>
  </body>
</html>
